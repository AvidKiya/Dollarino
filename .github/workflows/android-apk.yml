name: Build Dollarino Android APK

# The ubuntu-latest runner image already ships the Android SDK (ANDROID_HOME /
# ANDROID_SDK_ROOT with platform 35 + build-tools). Downloading cmdline-tools again via
# android-actions/setup-android is both redundant and fragile (it fetches a pinned
# commandlinetools zip from dl.google.com), which is exactly how run 45943390061 failed
# in 7s at "Setup Android SDK". We therefore reuse the preinstalled SDK and only verify
# it, then compile with Gradle.
#
# Every Gradle invocation runs through scripts/cf-step.sh, which republishes the tail of
# the real output as a workflow annotation. Job logs live behind short-lived signed blob
# URLs that some environments cannot read; annotations always are.

on:
  workflow_dispatch:
  # Also validate pull requests: the APK build must never be broken by a merge, and CI
  # feedback belongs on the PR rather than after it lands on main.
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'scripts/build-android.mjs'
      - 'scripts/cf-step.sh'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'scripts/build-android.mjs'
      - '.github/workflows/android-apk.yml'

jobs:
  build-android:
    name: Compile debug + unsigned release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "::error title=Android SDK missing::Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set on this runner."
            exit 1
          fi
          echo "Using Android SDK at $SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" 2>/dev/null || echo "::warning title=No platforms::$SDK/platforms is empty"
          if [ -f "$SDK/licenses/android-sdk-license" ]; then
            echo "Licenses already accepted"
          else
            echo "::warning title=SDK licenses::android-sdk-license not found; Gradle may prompt for acceptance"
          fi

      # The release zip ships no gradlew wrapper jar, so Gradle comes from the action.
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install workspace dependencies
        run: npm ci

      - name: Bundle web UI assets into Android APK
        run: bash scripts/cf-step.sh "Bundle web assets" npm run build:android

      - name: Show Gradle environment
        working-directory: apps/android
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true
          gradle --version 2>&1 | head -12

      - name: Compile Android Debug & Unsigned Release APK
        working-directory: apps/android
        run: bash ../../scripts/cf-step.sh "Gradle assemble" gradle --no-daemon --stacktrace assembleDebug assembleRelease

      # When Gradle fails, the annotation only carries the distilled error lines. This
      # step adds `gradle help` output (configuration-phase errors: missing plugin,
      # unresolvable dependency, bad SDK/NDK path) without the stack-frame noise.
      - name: Diagnose Gradle configuration
        if: failure()
        working-directory: apps/android
        run: gradle --no-daemon help 2>&1 | grep -vE '^[[:space:]]*(at |\.\.\. )' | tail -70 || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dollarino-android-apks
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7
