name: Deploy Dollarino to Cloudflare

# NOTE: GitHub Actions does NOT allow `secrets.*` inside step-level `if:` conditions.
# Referencing a secret there makes the whole workflow file invalid, so the run fails
# instantly (0s, "workflow file issue"). Secrets are therefore promoted to job-level
# `env` and only tested via `env.*` inside `if:`.
#
# NOTE: every Cloudflare command runs through scripts/cf-step.sh, which tees the real
# output and re-publishes the failing lines as a workflow annotation. Job logs are
# stored behind short-lived Azure blob URLs that some environments cannot read, while
# annotations stay available through the REST API — so failures remain diagnosable.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Core & Web Assets
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            apps/web/dist
            packages/core/dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy Worker + D1 + Pages
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NODE_OPTIONS: "--no-deprecation"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist

      - name: Skip notice (Cloudflare secrets not configured)
        if: ${{ env.CF_API_TOKEN == '' }}
        run: |
          echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set."
          echo "Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID as repository secrets to enable auto-deploy."

      - name: Wrangler guard (CLI + auth sanity check)
        if: ${{ env.CF_API_TOKEN != '' }}
        run: bash scripts/cf-step.sh "Wrangler guard" npx wrangler --version

      - name: Apply D1 Migrations (Remote)
        if: ${{ env.CF_API_TOKEN != '' }}
        run: bash scripts/cf-step.sh "D1 migrations" npx wrangler d1 migrations apply dollarino-db --remote

      - name: Deploy Cloudflare Worker (API + DO + Assets)
        if: ${{ env.CF_API_TOKEN != '' }}
        run: bash scripts/cf-step.sh "Worker deploy" npx wrangler deploy

      - name: Deploy Cloudflare Pages Frontend + Functions Proxy
        if: ${{ env.CF_API_TOKEN != '' && vars.SKIP_PAGES_DEPLOY != 'true' }}
        run: bash scripts/cf-step.sh "Pages deploy" npx wrangler pages deploy apps/web/dist --project-name=dollarino

      - name: Smoke-test deployed Worker version
        if: ${{ env.CF_API_TOKEN != '' }}
        run: |
          VERSION=$(node -p "require('./apps/worker/package.json').dollarinoVersion || require('./package.json').version")
          echo "Expected Dollarino version: $VERSION"
          for URL in "https://dollarino.pages.dev/api/health" "https://dollarino-worker.workers.dev/api/health"; do
            BODY=$(curl -fsS --max-time 20 "$URL" || true)
            if [ -z "$BODY" ]; then echo "::warning title=Health check failed::$URL did not respond"; continue; fi
            echo "$URL -> $BODY"
            case "$BODY" in
              *"\"version\":\"$VERSION\""*) echo "OK: $URL is on $VERSION" ;;
              *) echo "::warning title=Version mismatch::$URL is not serving $VERSION (possible stale Worker)" ;;
            esac
          done
