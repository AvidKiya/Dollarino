<!doctype html>
<html lang="fa" dir="rtl" data-theme="paper" class="mode-sidepanel">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دلارینو V11.9.1 — پایانه ساده</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="mode-sidepanel">
    <header class="sp-header">
      <div class="sp-brand">
        <img src="icons/icon-192.png" alt="Dollarino" />
        <div class="sp-title-group">
          <strong>دلارینو V11.9.1</strong>
          <span>حالت ساده · Chrome / Firefox / Edge</span>
        </div>
      </div>
      <div class="sp-actions">
        <div class="sp-mode-switch" role="tablist">
          <button id="sp-mode-native" type="button" class="sp-mode-btn active">بومی V11.9.1</button>
          <button id="sp-mode-embed" type="button" class="sp-mode-btn">وب زنده</button>
        </div>
        <button id="sp-reload" type="button" class="sp-btn" title="بارگذاری مجدد">🔄</button>
        <a id="sp-open-tab" href="https://dollarino.pages.dev/?ui_mode=simple" target="_blank" rel="noreferrer" class="sp-btn" title="باز کردن در تب">↗️</a>
      </div>
    </header>

    <main class="sp-main">
      <div id="sp-native-pane" class="sp-native-pane">
        <div class="bg-mesh" aria-hidden="true"></div>
        <div id="dlr-app" class="shell"></div>
      </div>

      <div id="sp-embed-pane" class="sp-embed-pane hidden">
        <div id="sp-loader" class="sp-loader">
          <div class="sp-spinner" aria-hidden="true"></div>
          <p>در حال بارگذاری نمای زنده حالت ساده دلارینو...</p>
        </div>
        <iframe
          id="sp-frame"
          title="Dollarino Simple Mode"
          allow="clipboard-read; clipboard-write"
        ></iframe>
      </div>
    </main>

    <footer id="sp-host-bar" class="sp-host-bar hidden">
      <span>آدرس سرور:</span>
      <input id="sp-host-input" type="url" dir="ltr" value="https://dollarino.pages.dev" placeholder="https://dollarino.pages.dev" />
      <button id="sp-host-save" type="button">اتصال</button>
    </footer>

    <script src="app.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
