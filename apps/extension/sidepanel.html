<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dollarino V11.7.2 — حالت ساده</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="sp-shell">
      <header class="sp-topbar">
        <div class="sp-brand">
          <img src="icons/icon-192.png" alt="Dollarino" class="sp-logo" />
          <div class="sp-title-group">
            <span class="sp-title">دلارینو</span>
            <span class="sp-pill">حالت ساده</span>
          </div>
        </div>
        <div class="sp-actions">
          <button id="btnReload" type="button" class="sp-icon-btn" title="بارگذاری مجدد">↻</button>
          <button id="btnSettings" type="button" class="sp-icon-btn" title="تنظیم آدرس سرور">⚙</button>
          <button id="btnOpenTab" type="button" class="sp-icon-btn" title="باز کردن در تب کامل">↗</button>
        </div>
      </header>

      <section id="settingsDrawer" class="sp-settings hidden">
        <label class="sp-settings-label" for="siteUrlInput">آدرس سایت دلارینو:</label>
        <div class="sp-settings-row" dir="ltr">
          <input id="siteUrlInput" type="url" class="sp-input" placeholder="https://dollarino.pages.dev" />
          <button id="btnSaveUrl" type="button" class="sp-save-btn">ذخیره</button>
        </div>
        <div class="sp-presets" dir="ltr">
          <button type="button" class="sp-preset" data-url="https://dollarino.pages.dev">Production (Cloudflare)</button>
          <button type="button" class="sp-preset" data-url="http://localhost:5173">Local Dev (:5173)</button>
        </div>
      </section>

      <main class="sp-viewport">
        <div id="loadingOverlay" class="sp-loading">
          <div class="sp-spinner"></div>
          <p>در حال بارگذاری حالت ساده دلارینو...</p>
        </div>

        <div id="errorBanner" class="sp-error hidden">
          <p class="sp-error-title">اتصال به پنل ساده برقرار نشد</p>
          <p id="errorDesc" class="sp-error-desc"></p>
          <div class="sp-error-actions">
            <button id="btnRetry" type="button" class="sp-btn-primary">تلاش مجدد</button>
            <button id="btnOpenSettingsErr" type="button" class="sp-btn-ghost">تغییر آدرس سرور</button>
          </div>
        </div>

        <iframe
          id="simpleFrame"
          title="Dollarino Simple Mode"
          class="sp-frame"
          allow="clipboard-read; clipboard-write"
        ></iframe>
      </main>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
