<!doctype html>
<html lang="fa" dir="rtl" data-theme="cosmic" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>دلارینو (Dollarino) — پایانه و موتورهای معاملاتی هوشمند</title>
    <meta name="description" content="پایانه معاملاتی فیوچرز، چارت AI، کپی‌ترید تلگرام و ربات چندارزی دلارینو در حساب دمو و Toobit / KCEX" />
    <meta name="theme-color" content="#050a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dollarino" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dollarino_look');
          var valid = ['obsidian', 'paper', 'cosmic', 'midnight'];
          var look = valid.indexOf(saved) >= 0
            ? saved
            : (localStorage.getItem('dollarino_theme') === 'light' ? 'paper' : 'cosmic');
          var d = document.documentElement;
          d.setAttribute('data-theme', look);
          var isLight = look === 'paper';
          d.classList.toggle('theme-light', isLight);
          d.classList.toggle('dark', !isLight);
          d.style.colorScheme = isLight ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
