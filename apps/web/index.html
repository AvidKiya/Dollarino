<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>دلارینو (Dollarino) — هوش مصنوعی مرکزی، استراتژی دلارینو V0.1 و کپی‌ترید</title>
    <meta name="description" content="ترید خودکار با هوش مصنوعی مرکزی دلارینو (ترکیب چند مدل)، استراتژی اختصاصی دلارینو V0.1 و کپی‌ترید در Toobit، KCEX و حساب دمو" />
    <meta name="theme-color" content="#0C44C8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dollarino" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dollarino_theme') === 'light' ? 'light' : 'dark';
          var d = document.documentElement;
          d.classList.toggle('theme-light', t === 'light');
          d.classList.toggle('dark', t === 'dark');
          d.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
